<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/vibe-box.jpg">
  <title>vibe-box - Collection of tools made with single html page.</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.5);
      --bg-secondary: #f1f5f9;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent-blue: #0ea5e9;
      --border-color: #e2e8f0;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-glass: rgba(30, 41, 59, 0.5);
      --bg-secondary: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #38bdf8;
      --border-color: #334155;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1030;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 20px var(--shadow-color);
    }

    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-brand {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      border-color: var(--accent-blue);
    }

    /* Main */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
      flex: 1;
      width: 100%;
    }

    /* Header Category Buttons */
    .header-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 3rem;
    }

    .header-btn {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .header-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .header-btn.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }

    .header-btn .filter-count {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.8;
    }

    /* Category */
    .category {
      margin-bottom: 3rem;
    }

    .category-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      padding-left: 0.75rem;
      border-left: 4px solid var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .category-count {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
    }

    /* Grid */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* Card */
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent-blue);
    }

    .project-name {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--accent-blue);
      transition: opacity 0.2s;
    }

    .project-name:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .project-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
      flex: 1;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: auto;
    }

    .project-tag {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 0.25rem 0.625rem;
      border-radius: 999px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    .footer p {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .main {
        padding: 2rem 1rem 3rem;
      }
      .project-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="index.html">vibe-box</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </nav>

  <main class="main">
    <header class="header-buttons" id="category-header" aria-label="项目分类筛选"></header>

    <div id="projects-container"></div>
  </main>

  <footer class="footer">
    <p>vibe-box - Collection of tools made with single html page.</p>
  </footer>

  <script>
    // ========== 项目数据 ==========
    // 在此处添加新项目
    const PROJECTS = [
      {
        name: "Link Cosmos",
        category: "知识图谱",
        description: "基于 NASA/APOD 的天文知识网络图谱与小知识问答页面应用。",
        path: "link-cosmos/index.html",
        tags: ["NASA/APOD", "天文小知识"]
      }
    ];

    // ========== 主题切换 ==========
    function getTheme() {
      return document.documentElement.getAttribute('data-theme') || 'light';
    }

    function toggleTheme() {
      const current = getTheme();
      const next = current === 'light' ? 'dark' : 'light';
      applyTheme(next);
      localStorage.setItem('theme', next);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀' : '🌙';
    }

    // ========== 渲染项目 ==========
    let currentFilter = 'all';

    function groupByCategory(projects) {
      const groups = {};
      projects.forEach(p => {
        const cat = p.category || '未分类';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(p);
      });
      return groups;
    }

    function renderCategorySection(category, projects) {
      return `
        <section class="category">
          <h2 class="category-title">
            ${category}
            <span class="category-count">${projects.length}</span>
          </h2>
          <div class="project-grid">
            ${projects.map(p => `
              <article class="project-card">
                <a href="${p.path}" class="project-name">${p.name}</a>
                <p class="project-desc">${p.description}</p>
                <div class="project-tags">
                  ${p.tags.map(t => `<span class="project-tag">${t}</span>`).join('')}
                </div>
              </article>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderProjects() {
      const container = document.getElementById('projects-container');
      const groups = groupByCategory(PROJECTS);
      let html = '';

      if (currentFilter === 'all') {
        for (const [category, projects] of Object.entries(groups)) {
          html += renderCategorySection(category, projects);
        }
      } else {
        const projects = groups[currentFilter] || [];
        if (projects.length > 0) {
          html += renderCategorySection(currentFilter, projects);
        }
      }

      container.innerHTML = html;
    }

    function renderCategoryButtons() {
      const header = document.getElementById('category-header');
      const groups = groupByCategory(PROJECTS);
      const total = PROJECTS.length;

      let html = `
        <button class="header-btn ${currentFilter === 'all' ? 'active' : ''}" data-category="all" type="button">
          全部 <span class="filter-count">${total}</span>
        </button>
      `;

      for (const [category, projects] of Object.entries(groups)) {
        html += `
          <button class="header-btn ${currentFilter === category ? 'active' : ''}" data-category="${category}" type="button">
            ${category} <span class="filter-count">${projects.length}</span>
          </button>
        `;
      }

      header.innerHTML = html;
    }

    function setFilter(category) {
      currentFilter = category;
      renderCategoryButtons();
      renderProjects();
    }

    function bindCategoryHeaderEvents() {
      const header = document.getElementById('category-header');
      header.addEventListener('click', (event) => {
        const button = event.target.closest('.header-btn');
        if (!button) return;
        const { category } = button.dataset;
        if (!category) return;
        setFilter(category);
      });
    }

    // ========== 初始化 ==========
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('theme');
      if (saved) {
        applyTheme(saved);
      }
      bindCategoryHeaderEvents();
      renderCategoryButtons();
      renderProjects();
    });

    // 跨标签页同步主题
    window.addEventListener('storage', (e) => {
      if (e.key === 'theme') {
        applyTheme(e.newValue || 'light');
      }
    });
  </script>
</body>
</html>
