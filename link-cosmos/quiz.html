<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Cosmos - 天文知识测试</title>
  <link rel="icon" href="./logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="index.html">✦ Link Cosmos</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">知识图谱</a></li>
          <li class="nav-item"><a class="nav-link active" href="quiz.html">知识测试</a></li>
          <li class="nav-item ms-2">
            <button class="theme-toggle" onclick="toggleTheme()">
              <span id="themeIcon">🌙</span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 quiz-container">
    <!-- Start Screen -->
    <div id="start-screen" class="text-center py-5">
      <div class="card-cosmos p-5 animate-fade-in">
        <div class="mb-4" style="font-size: 4rem;">🌌</div>
        <h2 class="fw-bold mb-3">准备好探索宇宙了吗？</h2>
        <p class="text-secondary mb-4">题库共 <strong id="total-questions">--</strong> 道题目，每次随机抽取 <strong>10</strong> 道<br/>每题 <strong>10</strong> 分，满分 <strong>100</strong> 分</p>
        <button class="btn-cosmos btn-lg" onclick="startQuiz()">开始测试</button>
        <div class="mt-4">
          <a href="index.html" class="text-decoration-none" style="color: var(--accent-blue);">← 返回知识图谱</a>
        </div>
      </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="d-none">
      <!-- Progress -->
      <div class="card-cosmos p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-semibold">答题进度</span>
          <span class="text-muted" id="progress-text">1 / 10</span>
        </div>
        <div class="progress-cosmos">
          <div class="progress-bar" id="progress-bar" style="width: 10%"></div>
        </div>
        <div class="text-center mt-2">
          <span class="small text-muted">当前得分: <strong id="current-score">0</strong></span>
        </div>
      </div>

      <!-- Question -->
      <div id="question-container"></div>

      <!-- Controls -->
      <div class="d-flex justify-content-between mt-3 mb-5">
        <button class="btn-cosmos-outline" onclick="quitQuiz()" id="btn-quit">退出</button>
        <button class="btn-cosmos" onclick="nextQuestion()" id="btn-next" disabled>下一题 →</button>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="d-none text-center py-4">
      <div class="card-cosmos p-5 animate-fade-in">
        <h2 class="fw-bold mb-3">测试完成！</h2>

        <div class="score-circle" id="score-circle" style="--score: 0;">
          <div class="score-text" id="final-score">0</div>
        </div>

        <p class="fs-5 mb-2" id="score-message">继续加油！</p>
        <p class="text-secondary mb-4" id="score-detail">答对 0 / 10 题</p>

        <div class="d-flex justify-content-center gap-3 flex-wrap">
          <button class="btn-cosmos" onclick="startQuiz()">再测一次</button>
          <a href="index.html" class="btn-cosmos-outline text-decoration-none d-inline-flex align-items-center">知识图谱</a>
        </div>

        <!-- Review -->
        <div class="mt-4 text-start">
          <h5 class="fw-bold mb-3">答题回顾</h5>
          <div id="review-container"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quit Confirm Modal -->
  <div class="modal fade" id="quitModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">确认退出</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">确定要退出测试吗？当前进度将不会保存。</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cosmos-outline" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn-cosmos" id="btn-confirm-quit" data-bs-dismiss="modal">确认退出</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
